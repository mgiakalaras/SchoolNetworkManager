name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./SchoolNetworkManager
          push: true
          tags: |
            ghcr.io/mgiakalaras/schoolnetworkmanager:latest
            ghcr.io/mgiakalaras/schoolnetworkmanager:${{ github.sha }}
