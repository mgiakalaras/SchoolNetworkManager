# Stack για Portainer (Stacks → schoolnetworkmanager → Editor)
# Αν αλλάξεις κάτι, πάτα «Update the stack».

services:
  schoolnetworkmanager:
    # Το image που χτίζει μόνο του το GitHub σε κάθε ανέβασμα (το package πρέπει να είναι Public).
    # Νέα έκδοση: Update the stack με «Re-pull image» ανοιχτό.
    image: ghcr.io/mgiakalaras/schoolnetworkmanager:latest
    container_name: schoolnetworkmanager
    restart: unless-stopped

    # Απαραίτητο για MAC, σάρωση δικτύου και Wake-on-LAN.
    # Με host network η εφαρμογή ακούει απευθείας στο port 5055 του Zima.
    network_mode: host

    environment:
      TZ: Europe/Athens
      ADMIN_PASSWORD: "ΑΛΛΑΞΕ-ΜΕ"

    volumes:
      - /DATA/AppData/schoolnetworkmanager/data:/app/data
      - /DATA/AppData/schoolnetworkmanager/uploads:/app/wwwroot/uploads
